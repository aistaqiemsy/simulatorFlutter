<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Pemrograman Flutter untuk Pemula</title>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel untuk JSX -->
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        .phone-mockup { width: min(340px, 100%); height: min(680px, calc(100vh - 2rem)); min-height: 480px; border: 14px solid #1e293b; border-radius: 40px; overflow: hidden; position: relative; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); background-color: white; display: flex; flex-direction: column; transition: all 0.3s ease; }
        .notch { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 120px; height: 25px; background-color: #1e293b; border-bottom-left-radius: 15px; border-bottom-right-radius: 15px; z-index: 50; }
        .flash-render { animation: flashBg 0.6s ease-out; }
        @keyframes flashBg { 0% { background-color: rgba(74, 222, 128, 0.7); box-shadow: 0 0 15px rgba(74,222,128,0.5); } 100% { background-color: transparent; box-shadow: none; } }
        .flash-render-blue { animation: flashBgBlue 0.6s ease-out; }
        @keyframes flashBgBlue { 0% { background-color: rgba(96, 165, 250, 0.7); box-shadow: 0 0 15px rgba(96,165,250,0.5); } 100% { background-color: transparent; box-shadow: none; } }
        .shake-animation { animation: shake 0.4s ease-in-out; }
        @keyframes shake { 0%, 100% { transform: translateX(0); border-color: #fca5a5; } 25% { transform: translateX(-5px); border-color: #ef4444; } 50% { transform: translateX(5px); border-color: #ef4444; } 75% { transform: translateX(-5px); border-color: #ef4444; } }
        .drop-active { border: 2px solid #3b82f6 !important; background-color: rgba(59, 130, 246, 0.1) !important; }
        @keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .alert-toast { animation: slideDown 0.3s ease-out forwards; }
        .smooth-transition { transition: all 0.5s ease; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;
        const DEFAULT_EXAM_ENDPOINT = 'https://script.google.com/a/macros/smkwikrama.sch.id/s/AKfycbyzFs7nEeYNk_O6LaVZD6k9ht4JRJDU2NuQ7tF444zY-PfTiTsiybRMWehEi8wqhNCx/exec';
        const isAppsScriptEndpoint = (url) => url.protocol === 'https:'
            && url.hostname === 'script.google.com'
            && /^\/(?:a\/)?macros\/(?:s\/[^/]+|[^/]+\/s\/[^/]+)\/exec$/.test(url.pathname);

        const DndStatelessCard = ({ onDragOver, onDrop, showAlert }) => {
            const [isShaking, setIsShaking] = useState(false);
            const handleClick = (e) => {
                e.stopPropagation();
                setIsShaking(true);
                showAlert("StatelessWidget tidak menyimpan state lokal. Ubah data/properti dari parent untuk mengubah tampilannya.");
                setTimeout(() => setIsShaking(false), 400);
            };
            return (
                <div onDragOver={onDragOver} onDrop={onDrop} className={`bg-white border-2 border-dashed border-red-300 p-3 rounded-lg shadow-sm my-1 mx-2 text-center transition-transform ${isShaking ? 'shake-animation border-red-500 bg-red-50' : ''}`}>
                    <div className="text-[10px] font-bold text-red-600 mb-2 uppercase tracking-wide">🧊 Stateless Card</div>
                    <button onClick={handleClick} className="bg-red-100 hover:bg-red-200 text-red-700 text-xs px-3 py-1.5 rounded border border-red-300 shadow-sm transition">Coba Ubah Tampilan</button>
                </div>
            );
        };

        const DndStatefulCounter = ({ onDragOver, onDrop }) => {
            const [likes, setLikes] = useState(0);
            const [isFlashing, setIsFlashing] = useState(false);
            const handleClick = (e) => {
                e.stopPropagation(); setLikes(prev => prev + 1); setIsFlashing(true);
                setTimeout(() => setIsFlashing(false), 600);
            };
            return (
                <div onDragOver={onDragOver} onDrop={onDrop} className={`bg-white border-2 border-dashed border-green-300 p-3 rounded-lg shadow-sm my-1 mx-2 text-center transition-colors duration-300 ${isFlashing ? 'flash-render border-green-500' : ''}`}>
                    <div className="text-[10px] font-bold text-green-600 mb-2 uppercase tracking-wide">🔋 Stateful Counter</div>
                    <div className="flex items-center justify-center gap-3">
                        <span className="text-lg font-bold text-slate-700">{likes}</span>
                        <button onClick={handleClick} className="bg-pink-100 hover:bg-pink-200 text-pink-600 text-sm px-3 py-1 rounded-full border border-pink-300 shadow-sm flex items-center gap-1">❤️ Like</button>
                    </div>
                </div>
            );
        };

        function App() {
            const [activeMode, setActiveMode] = useState('basic');

            // --- STATE: MODE 1 (Basic & Hot Reload) ---
            const [widgetsBasic, setWidgetsBasic] = useState([]);
            const [draftColor, setDraftColor] = useState('bg-blue-600');
            const [draftTitle, setDraftTitle] = useState('Flutter App');
            const [activeColor, setActiveColor] = useState('bg-blue-600');
            const [activeTitle, setActiveTitle] = useState('Flutter App');
            const [basicCount, setBasicCount] = useState(0);
            const [basicDragOver, setBasicDragOver] = useState(false);

            // --- STATE: MODE 2 (Drag & Drop) ---
            const [elementsDnd, setElementsDnd] = useState([{ id: 'root', type: 'ScaffoldBody', parentId: null }]);
            const [builderTargetId, setBuilderTargetId] = useState('root');
            const [dragOverId, setDragOverId] = useState(null);
            const [alertMsg, setAlertMsg] = useState(null);

            // --- STATE: MODE 3 (Teori State) ---
            const [parentData, setParentData] = useState(1);
            const [likesTheory, setLikesTheory] = useState(0);
            const [isStatefulFlashing, setIsStatefulFlashing] = useState(false);
            const [isStatelessFlashing, setIsStatelessFlashing] = useState(false);

            // --- STATE: UJIAN ---
            const [examEndpoint, setExamEndpoint] = useState(() => {
                try { return localStorage.getItem('flutterExamEndpoint') || DEFAULT_EXAM_ENDPOINT; }
                catch (error) { return DEFAULT_EXAM_ENDPOINT; }
            });
            const [examNis, setExamNis] = useState('');
            const [examParticipant, setExamParticipant] = useState(null);
            const [examLevels, setExamLevels] = useState([]);
            const [selectedExamLevel, setSelectedExamLevel] = useState(null);
            const [examQuestions, setExamQuestions] = useState([]);
            const [examAnswers, setExamAnswers] = useState({});
            const [examStatus, setExamStatus] = useState('locked');
            const [examDialogOpen, setExamDialogOpen] = useState(false);
            const [examLoading, setExamLoading] = useState(false);
            const [examError, setExamError] = useState('');
            const [examResult, setExamResult] = useState(null);

            // --- FUNGSI GLOBAL ---
            const showAlert = (msg) => {
                setAlertMsg(msg);
                setTimeout(() => setAlertMsg(null), 4500);
            };
            const requestExamApi = (parameters) => new Promise((resolve, reject) => {
                let endpoint;
                try {
                    endpoint = new URL(examEndpoint);
                } catch (error) {
                    reject(new Error('Alamat backend belum diatur. Periksa konfigurasi aplikasi.'));
                    return;
                }
                if (!isAppsScriptEndpoint(endpoint)) {
                    reject(new Error('Alamat backend harus berupa URL web app Google Apps Script yang berakhiran /exec.'));
                    return;
                }

                const callbackName = `flutterLabCallback_${Date.now()}_${Math.random().toString(36).slice(2)}`;
                const script = document.createElement('script');
                let timeoutId;
                const cleanup = () => {
                    clearTimeout(timeoutId);
                    delete window[callbackName];
                    script.remove();
                };
                window[callbackName] = (response) => {
                    cleanup();
                    resolve(response);
                };
                script.onerror = () => {
                    cleanup();
                    reject(new Error('Tidak dapat menghubungi backend ujian. Periksa URL dan publikasi Apps Script.'));
                };
                endpoint.searchParams.set('callback', callbackName);
                Object.entries(parameters).forEach(([key, value]) => endpoint.searchParams.set(key, String(value)));
                timeoutId = setTimeout(() => {
                    cleanup();
                    reject(new Error('Backend tidak merespons. Coba lagi atau periksa koneksi Google Sheets.'));
                }, 20000);
                script.src = endpoint.toString();
                document.head.appendChild(script);
            });
            const startExam = async (event) => {
                event.preventDefault();
                setExamLoading(true);
                setExamError('');
                setExamResult(null);
                try {
                    const response = await requestExamApi({ action: 'start', nis: examNis.trim() });
                    if (!response.success || !response.participant) throw new Error(response.message || 'NIS tidak dapat diverifikasi.');
                    setExamParticipant(response.participant);
                    setExamLevels(response.levels || []);
                    setSelectedExamLevel(null);
                    setExamStatus('verified');
                    setExamDialogOpen(false);
                } catch (error) {
                    setExamStatus('locked');
                    setExamError(error.message);
                } finally {
                    setExamLoading(false);
                }
            };
            const beginAssessment = async (level) => {
                setExamLoading(true);
                setExamError('');
                try {
                    const response = await requestExamApi({ action: 'questions', nis: examNis.trim(), level });
                    if (!response.success || !Array.isArray(response.questions) || response.questions.length === 0) {
                        throw new Error(response.message || 'Soal asesmen belum tersedia.');
                    }
                    setExamQuestions(response.questions);
                    setExamAnswers({});
                    setSelectedExamLevel(level);
                    setExamStatus('inProgress');
                } catch (error) {
                    setExamError(error.message);
                } finally {
                    setExamLoading(false);
                }
            };
            const returnToLevelSelection = () => {
                if (examLoading) return;
                if (Object.keys(examAnswers).length && !window.confirm('Kembali ke pilihan level? Jawaban sementara untuk level ini akan dihapus.')) return;
                setExamQuestions([]);
                setExamAnswers({});
                setSelectedExamLevel(null);
                setExamError('');
                setExamStatus('verified');
            };
            const submitExam = async () => {
                if (examQuestions.some(question => !examAnswers[question.id])) {
                    setExamError('Jawab semua soal sebelum mengirim ujian.');
                    return;
                }
                setExamLoading(true);
                setExamError('');
                try {
                    const response = await requestExamApi({
                        action: 'submit',
                        nis: examNis.trim(),
                        level: selectedExamLevel,
                        answers: JSON.stringify(examAnswers)
                    });
                    if (!response.success) throw new Error(response.message || 'Jawaban belum dapat disimpan.');
                    setExamLevels(response.levels || examLevels);
                    setExamResult({ ...response, passed: response.passed });
                    setExamStatus('completed');
                } catch (error) {
                    setExamError(error.message);
                } finally {
                    setExamLoading(false);
                }
            };
            const resetExam = () => {
                setExamStatus(examParticipant ? 'verified' : 'locked');
                setExamDialogOpen(false);
                setExamQuestions([]);
                setExamAnswers({});
                setExamResult(null);
                setSelectedExamLevel(null);
                setExamError('');
            };
            const exitExam = () => {
                if (examLoading) return;
                if (examStatus === 'inProgress' && !window.confirm('Keluar dari asesmen? Jawaban yang belum dikumpulkan akan hilang.')) return;
                setExamStatus('locked');
                setExamDialogOpen(false);
                setExamNis('');
                setExamParticipant(null);
                setExamLevels([]);
                setExamQuestions([]);
                setExamAnswers({});
                setExamResult(null);
                setSelectedExamLevel(null);
                setExamError('');
                setActiveMode('basic');
            };
            const openExam = () => {
                setActiveMode('exam');
                if (examStatus === 'locked') {
                    setExamError('');
                    setExamDialogOpen(true);
                }
            };

            // --- FUNGSI MODE 1 ---
            const addWidgetBasic = (type) => setWidgetsBasic(prev => [...prev, { id: `${Date.now()}-${prev.length}`, type }]);
            const handleBasicDragStart = (event, type) => {
                event.dataTransfer.setData('basicWidgetType', type);
                event.dataTransfer.effectAllowed = 'copy';
            };
            const handleBasicDrop = (event) => {
                event.preventDefault();
                setBasicDragOver(false);
                const type = event.dataTransfer.getData('basicWidgetType');
                if (['Text', 'ElevatedButton', 'Icon'].includes(type)) addWidgetBasic(type);
            };
            const clearWidgetsBasic = () => setWidgetsBasic([]);
            const triggerHotReload = () => { setActiveColor(draftColor); setActiveTitle(draftTitle); };
            const dartString = (value) => JSON.stringify(value).replace(/\$/g, '\\$');
            const renderDartNode = (node) => {
                const children = elementsDnd.filter(el => el.parentId === node.id);
                const child = children.length ? renderDartNode(children[0]) : 'const SizedBox.shrink()';
                const childList = children.map(renderDartNode).join(',\n');
                switch (node.type) {
                    case 'Column': return `Column(children: [\n${childList}\n])`;
                    case 'Row': return `Row(children: [\n${childList}\n])`;
                    case 'ListView': return `ListView(shrinkWrap: true, children: [\n${childList}\n])`;
                    case 'Container': return `Container(padding: const EdgeInsets.all(12), child: ${child})`;
                    case 'Padding': return `Padding(padding: const EdgeInsets.all(16), child: ${child})`;
                    case 'Center': return `Center(child: ${child})`;
                    case 'Card': return `Card(child: ${child})`;
                    case 'Text': return `const Text('Halo, Flutter!')`;
                    case 'ElevatedButton': return `ElevatedButton(onPressed: () {}, child: const Text('Simpan Data'))`;
                    case 'Icon': return `const Icon(Icons.star, color: Colors.blue)`;
                    case 'Image': return `Image.network('https://picsum.photos/300/100', fit: BoxFit.cover)`;
                    case 'FlutterLogo': return `const FlutterLogo(size: 48)`;
                    case 'TextField': return `const TextField(decoration: InputDecoration(hintText: 'Ketik sesuatu...'))`;
                    case 'StatelessCard': return `const Card(child: Padding(padding: EdgeInsets.all(12), child: Text('Stateless: tampilan dari parent')))`;
                    case 'StatefulCounter': return `ElevatedButton(onPressed: () {}, child: const Text('Stateful Counter (lihat tab Teori State)'))`;
                    default: return 'const SizedBox.shrink()';
                }
            };
            const getBuilderCode = () => {
                const children = elementsDnd.filter(el => el.parentId === 'root');
                const body = children.length === 0
                    ? 'const Center(child: Text(\'Tarik widget ke area body\'))'
                    : children.length === 1
                        ? renderDartNode(children[0])
                        : `Column(children: [\n${children.map(renderDartNode).join(',\n')}\n])`;
                return `import 'package:flutter/material.dart';

void main() => runApp(const MyApp());

class MyApp extends StatelessWidget {
  const MyApp({super.key});

  @override
  Widget build(BuildContext context) {
    return MaterialApp(
      title: 'Flutter Pemula',
      home: Scaffold(
        appBar: AppBar(title: const Text('Flutter App')),
        body: ${body},
      ),
    );
  }
}`;
            };
            const copyBuilderCode = () => {
                navigator.clipboard.writeText(getBuilderCode())
                    .then(() => showAlert('Kode Flutter berhasil disalin. Tempelkan ke lib/main.dart.'))
                    .catch(() => showAlert('Clipboard tidak tersedia. Pilih dan salin kode secara manual.'));
            };
            const getStarterCode = () => {
                const seedColor = {
                    'bg-blue-600': 'Colors.blue',
                    'bg-emerald-600': 'Colors.green',
                    'bg-violet-600': 'Colors.deepPurple',
                    'bg-rose-600': 'Colors.pink'
                }[activeColor] || 'Colors.blue';
                return `import 'package:flutter/material.dart';

void main() => runApp(const MyApp());

class MyApp extends StatelessWidget {
  const MyApp({super.key});

  @override
  Widget build(BuildContext context) => MaterialApp(
    title: ${dartString(activeTitle)},
    theme: ThemeData(colorScheme: ColorScheme.fromSeed(seedColor: ${seedColor})),
    home: const CounterPage(),
  );
}

class CounterPage extends StatefulWidget {
  const CounterPage({super.key});

  @override
  State<CounterPage> createState() => _CounterPageState();
}

class _CounterPageState extends State<CounterPage> {
  int _count = 0;

  void _increment() => setState(() => _count++);

  @override
  Widget build(BuildContext context) => Scaffold(
    appBar: AppBar(title: Text(${dartString(activeTitle)})),
    body: Center(
      child: Column(
        mainAxisSize: MainAxisSize.min,
        children: [
          const Text('Tombol ditekan sebanyak:'),
          Text('$_count', style: Theme.of(context).textTheme.headlineMedium),
          ElevatedButton(onPressed: _increment, child: const Text('Tambah')),
        ],
      ),
    ),
  );
}`;
            };
            const copyStarterCode = () => {
                navigator.clipboard.writeText(getStarterCode())
                    .then(() => showAlert('Kode aplikasi counter berhasil disalin ke clipboard.'))
                    .catch(() => showAlert('Clipboard tidak tersedia. Pilih dan salin kode secara manual.'));
            };

            // --- FUNGSI MODE 2 ---
            const clearTreeDnd = () => {
                setElementsDnd([{ id: 'root', type: 'ScaffoldBody', parentId: null }]);
                setBuilderTargetId('root');
            };
            const handleDragStart = (e, type) => e.dataTransfer.setData('widgetType', type);
            const leafWidgets = ['Text', 'ElevatedButton', 'Icon', 'Image', 'FlutterLogo', 'TextField', 'StatelessCard', 'StatefulCounter'];
            const singleChildWidgets = ['Container', 'Padding', 'Center', 'Card'];
            const addChildWidget = (parentId, type) => {
                const parent = elementsDnd.find(el => el.id === parentId);
                const parentType = parent ? parent.type : 'ScaffoldBody';
                const children = elementsDnd.filter(el => el.parentId === parentId);
                if (leafWidgets.includes(parentType)) {
                    showAlert(`🚨 ERROR: Widget '${parentType}' adalah LEAF NODE. Tidak bisa diisi child di dalamnya.`);
                    return;
                }
                if (singleChildWidgets.includes(parentType) && children.length >= 1) {
                    showAlert(`⚠️ ERROR: Widget '${parentType}' hanya menerima satu child. Pilih body atau layout lain.`);
                    return;
                }
                const id = `${Date.now()}-${elementsDnd.length}`;
                setElementsDnd(prev => [...prev, { id, type, parentId }]);
                if (['Column', 'Row', 'ListView', ...singleChildWidgets].includes(type)) setBuilderTargetId(id);
            };
            const addWidgetToTarget = (type) => addChildWidget(builderTargetId, type);

            const renderNode = (node) => {
                const children = elementsDnd.filter(el => el.parentId === node.id);
                const isDragOver = dragOverId === node.id;

                const onDragOver = (e) => { e.preventDefault(); e.stopPropagation(); setDragOverId(node.id); };
                const onDragLeave = (e) => { e.preventDefault(); e.stopPropagation(); if (dragOverId === node.id) setDragOverId(null); };
                const onDrop = (e) => {
                    e.preventDefault(); e.stopPropagation(); setDragOverId(null);
                    const draggedType = e.dataTransfer.getData('widgetType');
                    if (!draggedType) return;
                    
                    // Kategori Widget
                    addChildWidget(node.id, draggedType);
                };

                const baseClasses = "relative transition-colors duration-200 rounded m-1 cursor-default border-2 border-dashed";
                let content = children.map(child => renderNode(child));

                switch (node.type) {
                    // LAYOUT ROOT & MULTI-CHILD
                    case 'ScaffoldBody':
                        return <div className={`min-h-[400px] h-full p-2 flex flex-col ${isDragOver ? 'drop-active' : ''}`} onDragOver={onDragOver} onDragLeave={onDragLeave} onDrop={onDrop}>{children.length === 0 && <div className="text-gray-400 text-center mt-10 pointer-events-none">Area Kosong<br/>Tarik & Lepas widget ke sini</div>}{content}</div>;
                    case 'Column':
                        return <div key={node.id} className={`${baseClasses} p-2 min-h-[80px] flex flex-col gap-2 bg-blue-50 border-blue-200 ${isDragOver ? 'drop-active' : ''}`} onDragOver={onDragOver} onDragLeave={onDragLeave} onDrop={onDrop}><div className="absolute -top-3 left-2 bg-blue-200 text-[10px] px-1 rounded font-bold text-blue-800">Column (↓)</div>{content}</div>;
                    case 'Row':
                        return <div key={node.id} className={`${baseClasses} p-2 min-h-[60px] flex flex-row gap-2 bg-green-50 border-green-200 overflow-x-auto ${isDragOver ? 'drop-active' : ''}`} onDragOver={onDragOver} onDragLeave={onDragLeave} onDrop={onDrop}><div className="absolute -top-3 left-2 bg-green-200 text-[10px] px-1 rounded font-bold text-green-800">Row (→)</div>{content}</div>;
                    case 'ListView':
                        return <div key={node.id} className={`${baseClasses} p-2 min-h-[120px] max-h-[250px] overflow-y-auto flex flex-col gap-2 bg-orange-50 border-orange-200 ${isDragOver ? 'drop-active' : ''}`} onDragOver={onDragOver} onDragLeave={onDragLeave} onDrop={onDrop}><div className="absolute -top-3 left-2 bg-orange-200 text-[10px] px-1 rounded font-bold text-orange-800">ListView (Scroll ↓)</div>{content}</div>;

                    // LAYOUT SINGLE-CHILD
                    case 'Container':
                        return <div key={node.id} className={`${baseClasses} p-4 min-h-[60px] bg-slate-100 border-slate-300 ${isDragOver ? 'drop-active' : ''}`} onDragOver={onDragOver} onDragLeave={onDragLeave} onDrop={onDrop}><div className="absolute -top-3 left-2 bg-slate-300 text-[10px] px-1 rounded font-bold">Container</div>{content}</div>;
                    case 'Padding':
                        return <div key={node.id} className={`${baseClasses} p-6 min-h-[60px] bg-purple-50 border-purple-200 ${isDragOver ? 'drop-active' : ''}`} onDragOver={onDragOver} onDragLeave={onDragLeave} onDrop={onDrop}><div className="absolute -top-3 left-2 bg-purple-200 text-[10px] px-1 rounded font-bold text-purple-800">Padding</div>{content}</div>;
                    case 'Center':
                        return <div key={node.id} className={`${baseClasses} p-2 min-h-[80px] bg-teal-50 border-teal-200 flex items-center justify-center ${isDragOver ? 'drop-active' : ''}`} onDragOver={onDragOver} onDragLeave={onDragLeave} onDrop={onDrop}><div className="absolute -top-3 left-2 bg-teal-200 text-[10px] px-1 rounded font-bold text-teal-800">Center</div>{content}</div>;
                    case 'Card':
                        return <div key={node.id} className={`relative m-2 p-2 min-h-[60px] bg-white rounded-xl shadow-md border border-gray-100 ${isDragOver ? 'drop-active' : ''}`} onDragOver={onDragOver} onDragLeave={onDragLeave} onDrop={onDrop}><div className="absolute -top-2 -left-2 bg-gray-700 text-white text-[9px] px-1 rounded font-bold">Card</div>{content}</div>;

                    // LEAF NODES (UI Elements)
                    case 'Text': return <div key={node.id} className="bg-white border border-gray-300 p-2 shadow-sm rounded text-sm my-1 mx-2 text-center" onDragOver={onDragOver} onDrop={onDrop}>"Teks Hello World"</div>;
                    case 'ElevatedButton': return <button key={node.id} className="bg-blue-600 text-white shadow-md rounded px-4 py-2 text-sm font-bold my-1 mx-auto block" onDragOver={onDragOver} onDrop={onDrop}>Simpan Data</button>;
                    case 'Icon': return <div key={node.id} className="text-blue-500 text-3xl text-center my-1" onDragOver={onDragOver} onDrop={onDrop}>★</div>;
                    case 'FlutterLogo': return <div key={node.id} className="text-blue-400 font-bold text-lg text-center my-2 flex items-center justify-center gap-1" onDragOver={onDragOver} onDrop={onDrop}><span className="text-2xl">🦋</span> Flutter</div>;

                                                <div className="mb-5 flex items-start justify-between gap-4">
                                                    <div>
                                                        <h3 id="exam-nis-title" className="text-xl font-bold text-slate-900">Verifikasi peserta</h3>
                                                        <p className="mt-1 text-sm text-slate-600">Masukkan NIS untuk memulai ujian.</p>
                                                    </div>
                                                    <button type="button" aria-label="Tutup" disabled={examLoading} onClick={() => setExamDialogOpen(false)} className="rounded-lg px-3 py-1 text-2xl leading-none text-slate-400 hover:bg-slate-100 hover:text-slate-700 disabled:opacity-50">×</button>
                                                </div>
                                                <form onSubmit={startExam} className="space-y-4">
                                                    <label className="block text-sm font-semibold text-slate-700">Nomor Induk Siswa (NIS)
                                                        <input autoFocus value={examNis} onChange={(event) => { setExamNis(event.target.value); setExamError(''); }} required autoComplete="off" className="mt-2 w-full rounded-xl border border-slate-300 p-3 text-base outline-none transition focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100" placeholder="Contoh: 12345678" />
                                                    </label>
                                                    {examError && <p role="alert" className="rounded-lg border border-red-200 bg-red-50 p-3 text-sm text-red-700">{examError}</p>}
                                                    <div className="flex gap-3 pt-1">
                                                        <button type="button" disabled={examLoading} onClick={() => setExamDialogOpen(false)} className="flex-1 rounded-xl border border-slate-300 px-4 py-3 font-semibold text-slate-700 hover:bg-slate-50 disabled:opacity-50">Batal</button>
                                                        <button type="submit" disabled={examLoading} className="flex-1 rounded-xl bg-indigo-600 px-4 py-3 font-bold text-white shadow-md shadow-indigo-200 hover:bg-indigo-700 disabled:opacity-60">
                                                            {examLoading ? 'Memeriksa...' : 'Verifikasi & Mulai'}
                                                        </button>
                                                    </div>
                                                </form>
                                            </div>
                                        </div>
                                    )}

                                    {examStatus === 'inProgress' && (
                                        <div className="space-y-4">
                                            <button
                                                type="button"
                                                onClick={returnToLevelSelection}
                                                disabled={examLoading}
                                                className="rounded-lg border border-indigo-200 bg-white px-3 py-2 text-sm font-bold text-indigo-700 transition hover:bg-indigo-50 disabled:cursor-not-allowed disabled:opacity-60"
                                            >
                                                ← Kembali ke Pilihan Level
                                            </button>
                                            <div className="flex items-center justify-between bg-white border rounded-lg p-3 text-sm">
                                                <span>Peserta: <b>{examNis}</b></span>
                                                <span>Level {selectedExamLevel} · {Object.keys(examAnswers).length}/{examQuestions.length} dijawab</span>
                                            </div>
                                            {examQuestions.map((question, index) => (
                                                <fieldset key={question.id} className="bg-white border rounded-lg p-4">
                                                    <legend className="font-bold text-sm px-1">{index + 1}. {question.question}</legend>
                                                    <div className="space-y-2 mt-2">
                                                        {question.options.map((option) => (
                                                            <label key={option.id} className="flex items-start gap-2 rounded p-2 hover:bg-indigo-50 cursor-pointer">
                                                                <input type="radio" name={`question-${question.id}`} value={option.id} checked={examAnswers[question.id] === option.id} onChange={() => setExamAnswers(prev => ({ ...prev, [question.id]: option.id }))} className="mt-1" />
                                                                <span className="text-sm">{option.text}</span>
                                                            </label>
                                                        ))}
                                                    </div>
                                                </fieldset>
                                            ))}
                                            <button onClick={submitExam} disabled={examLoading} className="w-full rounded bg-emerald-600 text-white font-bold p-3 hover:bg-emerald-700 disabled:opacity-60">
                                                {examLoading ? 'Mengirim dan menyimpan hasil...' : 'Kumpulkan ujian'}
                                            </button>
                                        </div>
                                    )}

                                    {examStatus === 'completed' && examResult && (
                                        <div className="fixed inset-0 z-[110] flex items-center justify-center bg-slate-950/60 p-4 backdrop-blur-sm">
                                            <div role="dialog" aria-modal="true" aria-labelledby="exam-result-title" className="w-full max-w-md overflow-hidden rounded-3xl bg-white text-center shadow-2xl">
                                                {examResult.passed ? (
                                                    <div className="bg-gradient-to-b from-emerald-50 to-white px-6 pb-6 pt-8">
                                                        <svg viewBox="0 0 160 120" role="img" aria-label="Ilustrasi keberhasilan" className="mx-auto mb-4 h-28 w-40">
                                                            <circle cx="80" cy="61" r="48" fill="#d1fae5" />
                                                            <path d="M56 61l16 16 34-36" fill="none" stroke="#059669" strokeWidth="10" strokeLinecap="round" strokeLinejoin="round" />
                                                            <path d="M29 23l4 10 10 4-10 4-4 10-4-10-10-4 10-4 4-10zm103 44l3 7 7 3-7 3-3 7-3-7-7-3 7-3 3-7z" fill="#fbbf24" />
                                                        </svg>
                                                        <p className="text-sm font-bold uppercase tracking-widest text-emerald-700">Target tercapai</p>
                                                        <h3 id="exam-result-title" className="mt-1 text-2xl font-extrabold text-slate-900">Asesmen Berhasil!</h3>
                                                        <p className="mt-2 text-sm text-slate-600">Hebat, {examParticipant ? examParticipant.name || 'peserta' : 'peserta'}! Kamu lulus Level {examResult.level} dan memperoleh badge kelulusan.</p>
                                                    </div>
                                                ) : (
                                                    <div className="bg-gradient-to-b from-amber-50 to-white px-6 pb-6 pt-8">
                                                        <svg viewBox="0 0 160 120" role="img" aria-label="Ilustrasi tetap semangat belajar" className="mx-auto mb-4 h-28 w-40">
                                                            <circle cx="80" cy="61" r="48" fill="#fef3c7" />
                                                            <path d="M54 43l18 18-18 18M106 43L88 61l18 18" fill="none" stroke="#d97706" strokeWidth="8" strokeLinecap="round" strokeLinejoin="round" />
                                                            <path d="M20 24l4 9 9 4-9 4-4 9-4-9-9-4 9-4 4-9zm116 49l3 7 7 3-7 3-3 7-3-7-7-3 7-3 3-7z" fill="#f59e0b" />
                                                        </svg>
                                                        <p className="text-sm font-bold uppercase tracking-widest text-amber-700">Terus berlatih</p>
                                                        <h3 id="exam-result-title" className="mt-1 text-2xl font-extrabold text-slate-900">Belum Berhasil</h3>
                                                        <p className="mt-2 text-sm text-slate-600">Jangan menyerah, {examParticipant ? examParticipant.name || 'peserta' : 'peserta'}. Pelajari kembali materi Level {examResult.level} lalu coba lagi.</p>
                                                    </div>
                                                )}
                                                <div className="px-6 pb-6">
                                                    <div className={`mx-auto -mt-2 inline-flex items-baseline gap-1 rounded-full px-5 py-2 ${examResult.passed ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}`}>
                                                        <span className="text-3xl font-extrabold">{examResult.score}</span><span className="text-sm font-bold">/ 100</span>
                                                    </div>
                                                    <p className="mt-3 text-sm text-slate-600">{examResult.correct} dari {examResult.total} jawaban benar · batas kelulusan 75</p>
                                                    <p className="mt-1 text-xs text-slate-400">Percobaan #{examResult.attemptNumber} · NIS {examNis}</p>
                                                    <button onClick={resetExam} className={`mt-5 w-full rounded-xl px-5 py-3 font-bold text-white shadow-md transition hover:-translate-y-0.5 ${examResult.passed ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-amber-600 hover:bg-amber-700'}`}>Selesai</button>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                    <p className="text-xs text-gray-500">Catatan: NIS berfungsi sebagai pemeriksaan kelayakan, bukan autentikasi identitas yang kuat. Batasi akses spreadsheet hanya untuk pengelola.</p>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* PANEL KANAN: Emulator Layar HP */}
                    <div className="w-full md:w-2/5 bg-slate-100 flex items-center justify-center p-4 relative">
                        <div className="phone-mockup shadow-2xl">
                            <div className="notch"></div>
                            
                            <div className={`${activeColor} smooth-transition text-white pt-10 pb-4 px-4 shadow-md z-10 flex items-center justify-center`}>
                                <h2 className="text-lg font-bold">{activeTitle}</h2>
                            </div>

                            <div className="flex-1 bg-white overflow-y-auto relative">
                                {activeMode === 'dnd' && <div className="h-full">{renderNode({id: 'root', type: 'ScaffoldBody'})}</div>}
                                {activeMode === 'basic' && (
                                    <div
                                        className={`p-5 text-center h-full transition-colors ${basicDragOver ? 'drop-active' : ''}`}
                                        onDragOver={(event) => { event.preventDefault(); event.dataTransfer.dropEffect = 'copy'; setBasicDragOver(true); }}
                                        onDragLeave={() => setBasicDragOver(false)}
                                        onDrop={handleBasicDrop}
                                    >
                                        <p className="text-gray-500 text-sm mb-2">Tombol ditekan sebanyak:</p>
                                        <p className="text-4xl font-bold text-slate-800 mb-4">{basicCount}</p>
                                        <button onClick={() => setBasicCount(prev => prev + 1)} className="bg-blue-600 text-white rounded-lg px-5 py-2 shadow">Tambah</button>
                                        {widgetsBasic.map((widget, index) => <div key={widget.id} className="mt-4">
                                            {widget.type === 'Text' && <p className="font-medium">Widget Text #{index + 1}</p>}
                                            {widget.type === 'ElevatedButton' && <button onClick={() => setBasicCount(prev => prev + 1)} className="mt-2 bg-slate-200 rounded px-3 py-1">Tombol tambahan</button>}
                                            {widget.type === 'Icon' && <div className="text-3xl text-blue-500">★</div>}
                                        </div>)}
                                    </div>
                                )}
                                {activeMode === 'state' && <div className="p-5 text-center text-gray-500 text-sm mt-10">Amati nilai parent dan state lokal pada panel pelajaran.</div>}
                                {activeMode === 'exam' && <div className="p-5 text-center text-gray-500 text-sm mt-10">Ujian pemahaman dikerjakan pada panel pelajaran.</div>}
                            </div>
                            
                            <div className="w-1/3 h-1 bg-gray-300 rounded-full mx-auto my-2"></div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
